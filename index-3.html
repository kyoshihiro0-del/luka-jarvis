<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071525"><title>Luka JARVIS v0.3</title>
<style>body{margin:0;background:#071525;color:#eaf8ff;font:17px system-ui,sans-serif;text-align:center}main{max-width:520px;margin:auto;padding:24px 18px}h1{letter-spacing:.1em}small{color:#9bc4d8}.orb{border:3px solid #42d7ff;border-radius:50%;width:145px;height:145px;display:grid;place-items:center;margin:25px auto;box-shadow:0 0 25px #18aadd66;font-size:60px}button{font:inherit;border:1px solid #4bd8ff;background:#12425b;color:white;border-radius:15px;padding:15px;min-height:56px}button:active{background:#246783}.primary{width:100%;background:#067ca2;font-weight:bold;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.panel{text-align:left;white-space:pre-wrap;background:#102a3b;border:1px solid #35617a;border-radius:14px;padding:16px;min-height:90px;margin:18px 0}input{background:#0c2635;color:white;border:1px solid #5d859a;border-radius:12px;padding:12px;min-width:0;flex:1;font:inherit}.entry{display:flex;gap:8px}.entry button{min-height:48px}p{line-height:1.5}</style></head>
<body><main><small>GALAXY ASSISTANT · v0.3</small><h1>LUKA JARVIS</h1><div class="orb">✦</div><button class="primary" id="listen">🎙 話しかける</button><div class="panel" id="output" role="status" aria-live="polite">起動しました。「話しかける」を押して指示してください。</div><div class="grid"><button id="test">✓ 動作テスト</button><button id="clock">🕒 時刻</button><button id="hello">👋 あいさつ</button><button id="music">♫ 音楽を開く</button><button id="youtube">▶ YouTube</button><button id="google">🔎 Google</button></div><div class="entry"><input id="typed" placeholder="文字で指示する" aria-label="文字で指示する"><button id="send">送信</button></div><p><small id="diagnostic">音声認識の対応状況を確認しています。</small></p><p><small>「今何時」「今日の日付」「音楽を開いて」「YouTubeを開いて」「Googleを開いて」「富士山を検索」などに対応。自由なAI会話や拍手起動はまだありません。音声認識には対応ブラウザとHTTPS接続が必要です。</small></p></main>
<script>
(function(){'use strict';const el=id=>document.getElementById(id),out=el('output');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;el('diagnostic').textContent='音声認識：'+(SR?'対応':'非対応')+' ／ 安全な接続：'+(window.isSecureContext?'はい':'いいえ');function show(t){out.textContent=t}function speak(t){show(t);if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.92;speechSynthesis.speak(u)}catch(e){show(t+'\n読み上げエラー：'+e.message)}}function go(url,msg){show(msg);location.href=url}function cmd(s){s=(s||'').trim();if(!s){show('文字を入力してください。');return}if(/何時|時刻|時間/.test(s))speak('現在の時刻は'+new Intl.DateTimeFormat('ja-JP',{hour:'numeric',minute:'2-digit'}).format(new Date())+'です。');else if(/日付|何日|今日/.test(s))speak('今日は'+new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(new Date())+'です。');else if(/YouTube|ユーチューブ/i.test(s))go('https://www.youtube.com/','YouTubeを開きます。');else if(/Googleを開|グーグルを開/i.test(s))go('https://www.google.com/','Googleを開きます。');else if(/音楽|ミュージック|music/i.test(s))go('https://music.youtube.com/','YouTube Musicを開きます。');else if(/こんにちは|おはよう|こんばんは|ジャービス|jarvis/i.test(s))speak('こんにちは。Luka JARVISです。');else if(/検索|調べて/.test(s)){const q=s.replace(/検索|調べて|ください|して|を/g,'').trim();if(q)go('https://www.google.com/search?q='+encodeURIComponent(q),'「'+q+'」を検索します。');else show('検索する言葉を入力してください。')}else show('「'+s+'」を受け取りました。\nこの指示はまだ未対応です。')}el('test').onclick=()=>speak('動作テスト成功。ジャービスです。');el('clock').onclick=()=>cmd('今何時');el('hello').onclick=()=>cmd('こんにちは');el('music').onclick=()=>cmd('音楽');el('youtube').onclick=()=>cmd('YouTubeを開いて');el('google').onclick=()=>cmd('Googleを開いて');el('send').onclick=()=>cmd(el('typed').value);el('typed').addEventListener('keydown',e=>{if(e.key==='Enter')cmd(el('typed').value)});el('listen').onclick=()=>{if(!SR){show('音声認識に対応していません。文字入力をお使いください。');return}const r=new SR();r.lang='ja-JP';r.interimResults=false;r.onstart=()=>show('聞いています…');r.onresult=e=>cmd(e.results[0][0].transcript);r.onerror=e=>show('マイクのエラー：'+e.error);r.onend=()=>{if(out.textContent==='聞いています…')show('認識できませんでした。もう一度お試しください。')};try{r.start()}catch(e){show('マイクを起動できません：'+e.message)}}})();
</script></body></html>
