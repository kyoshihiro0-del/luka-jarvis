<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luka JARVIS v0.2</title><style>body{margin:0;background:#071525;color:#eaf8ff;font:17px system-ui,sans-serif;text-align:center}main{max-width:520px;margin:auto;padding:24px 18px}h1{letter-spacing:.1em}small{color:#9bc4d8}.orb{border:3px solid #42d7ff;border-radius:50%;width:145px;height:145px;display:grid;place-items:center;margin:25px auto;box-shadow:0 0 25px #18aadd66;font-size:60px}button{font:inherit;border:1px solid #4bd8ff;background:#12425b;color:white;border-radius:15px;padding:15px;min-height:56px}button:active{background:#246783}.primary{width:100%;background:#067ca2;font-weight:bold;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.panel{text-align:left;white-space:pre-wrap;background:#102a3b;border:1px solid #35617a;border-radius:14px;padding:16px;min-height:90px;margin:18px 0}input{background:#0c2635;color:white;border:1px solid #5d859a;border-radius:12px;padding:12px;min-width:0;flex:1;font:inherit}.entry{display:flex;gap:8px}.entry button{min-height:48px}p{line-height:1.5}</style></head><body><main><small>GALAXY ASSISTANT · v0.2</small><h1>LUKA JARVIS</h1><div class="orb">✦</div><button class="primary" id="listen">🎙 話しかける</button><div class="panel" id="output" role="status" aria-live="polite">起動しました。まず「動作テスト」を押してください。</div><div class="grid"><button id="test">✓ 動作テスト</button><button id="clock">🕒 時刻</button><button id="hello">👋 あいさつ</button><button id="music">♫ 音楽を開く</button></div><div class="entry"><input id="typed" placeholder="文字で指示する" aria-label="文字で指示する"><button id="send">送信</button></div><p><small id="diagnostic">音声認識の対応状況を確認しています。</small></p><p><small>音声認識はChromeなどの対応ブラウザと安全な接続環境が必要です。ローカルファイルではマイクを利用できない場合があります。AIとの自由会話や拍手起動はまだありません。</small></p></main><script>
(function(){'use strict';const el=id=>document.getElementById(id),out=el('output');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const secure=window.isSecureContext;el('diagnostic').textContent='音声認識API：'+(SR?'対応':'非対応')+' ／ 安全な接続：'+(secure?'はい':'いいえ')+' ／ 開き方：'+location.protocol;function show(t){out.textContent=t}function speak(t){show(t);if(!('speechSynthesis'in window)){show(t+'\n※ この環境では音声読み上げが使えません。');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.92;u.onerror=()=>show(t+'\n※ 音声再生ができませんでした。');speechSynthesis.speak(u)}catch(e){show(t+'\n※ 読み上げエラー：'+e.message)}}function cmd(s){s=(s||'').trim();if(!s){show('文字を入力してください。');return}if(/何時|時刻|時間/.test(s))speak('現在の時刻は'+new Intl.DateTimeFormat('ja-JP',{hour:'numeric',minute:'2-digit'}).format(new Date())+'です。');else if(/日付|何日|今日/.test(s))speak('今日は'+new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(new Date())+'です。');else if(/音楽|ミュージック|music/i.test(s)){show('YouTube Musicを開きます。');location.href='https://music.youtube.com/'}else if(/こんにちは|おはよう|こんばんは|ジャービス|jarvis/i.test(s))speak('こんにちは。Luka JARVISです。');else if(/検索|調べて/.test(s)){let q=s.replace(/検索|調べて|ください|して|を/g,'').trim();if(q)location.href='https://www.google.com/search?q='+encodeURIComponent(q);else show('検索する言葉を入力してください。')}else show('入力を受け取りました：「'+s+'」\nこの指示はまだ未対応です。')}el('test').onclick=()=>speak('動作テスト成功。ジャービスです。');el('clock').onclick=()=>cmd('今何時');el('hello').onclick=()=>cmd('こんにちは');el('music').onclick=()=>cmd('音楽');el('send').onclick=()=>cmd(el('typed').value);el('typed').addEventListener('keydown',e=>{if(e.key==='Enter')cmd(el('typed').value)});el('listen').onclick=()=>{if(!SR){show('この開き方では音声認識に対応していません。下の文字入力か動作テストを使ってください。');return}let r=new SR();r.lang='ja-JP';r.interimResults=false;r.onstart=()=>show('聞いています…');r.onresult=e=>cmd(e.results[0][0].transcript);r.onerror=e=>show('マイクのエラー：'+e.error+'\nChromeでHTTPSのサイトから開く必要がある場合があります。');r.onend=()=>{if(out.textContent==='聞いています…')show('音声が認識されませんでした。もう一度お試しください。')};try{r.start()}catch(e){show('マイクを起動できません：'+e.message)}}})();
</script></body></html>
